<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablica - TaskBoard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="boards.html">TaskBoard</a>
            <div class="d-flex align-items-center">
                <select id="filterPriority" class="form-select form-select-sm me-3">
                    <option value="">Wszystkie priorytety</option>
                    <option value="low">Niski</option>
                    <option value="medium">Średni</option>
                    <option value="high">Wysoki</option>
                </select>
                <button id="newTaskBtn" class="btn btn-primary btn-sm me-3" data-bs-toggle="modal" data-bs-target="#taskModal">Nowe zadanie</button>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm">Wyloguj</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 id="boardTitle" class="mb-4">Tablica</h2>
        <div class="row mb-3 g-2">
            <div class="col-md-6">
                <input type="text" id="filterTitle" class="form-control" placeholder="Filtruj po tytule...">
            </div>
            <div class="col-md-6">
                <input type="text" id="filterPerson" class="form-control" placeholder="Filtruj po osobie...">
            </div>
        </div>
        <div class="row g-3">
            <section class="col-12 col-lg-4">
                <h3 class="h5">Do zrobienia</h3>
                <div class="d-grid gap-2" id="col-todo"></div>
            </section>
            <section class="col-12 col-lg-4">
                <h3 class="h5">W trakcie</h3>
                <div class="d-grid gap-2" id="col-in_progress"></div>
            </section>
            <section class="col-12 col-lg-4">
                <h3 class="h5">Gotowe</h3>
                <div class="d-grid gap-2" id="col-done"></div>
            </section>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="taskForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Nowe zadanie</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Tytuł</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                            <div class="invalid-feedback">Tytuł musi mieć od 3 do 100 znaków.</div>
                        </div>
                        <div class="mb-3">
                            <label for="taskPriority" class="form-label">Priorytet</label>
                            <select class="form-select" id="taskPriority">
                                <option value="low">Niski</option>
                                <option value="medium" selected>Średni</option>
                                <option value="high">Wysoki</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
                        <button type="submit" class="btn btn-primary">Zapisz</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/board.js"></script>
</body>
</html>
