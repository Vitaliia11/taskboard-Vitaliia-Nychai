<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablica - Taskboard</title>
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"href="css/style.css">
</head>

<body>

    <main class="container py-4">
        <div class="d-fix justify-content-between align-items-end mb-3">

        </div>
    </main>
    <div class="row g-3">
        <section class="col-12 col-lg-4">
            <h2 class="h5">Do zrobienia</h2>
            <div class="d-grid gap-2" id="col-todo"></div>
        </section>
        <section class="col-12 col-lg-4">
            <h2 class="h5">W trakcie</h2>
            <div class="d-grid gap-2" id="col-in_progress"></div>
        </section>
        <section class="col-12 col-lg-4">
            <h2 class="h5">Gotowe</h2>
            <div class="d-grid gap-2" id="col-done"></div>
        </section> 
    </div>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    
</body>
</html>
