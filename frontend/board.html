<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablica – TaskBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">TaskBoard</span>
      <span class="text-white" id="userName"></span>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-end mb-3">
      <div>
        <label for="filterPriority" class="form-label">Priorytet</label>
        <select class="form-select" id="filterPriority">
          <option value="">Wszystkie</option>
          <option value="high">Wysoki</option>
          <option value="medium">Średni</option>
          <option value="low">Niski</option>
        </select>
      </div>
      <button type="button" class="btn btn-primary" id="newTaskBtn">Dodaj zadanie</button>
    </div>

    <div class="row g-3">
        
      <section class="col-12 col-lg-4">
        <h2 class="h5">Do zrobienia</h2>
        <div class="d-grid gap-2" id="col-todo"></div>
      </section>

      <section class="col-12 col-lg-4">
        <h2 class="h5">W trakcie</h2>
        <div class="d-grid gap-2" id="col-in_progress"></div>
      </section>

      <section class="col-12 col-lg-4">
        <h2 class="h5">Gotowe</h2>
        <div class="d-grid gap-2" id="col-done"></div>
      </section>

    </div>
  </main>

  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="taskForm" novalidate>
        
        <div class="modal-header">
          <h2 class="modal-title h5" id="taskModalTitle">Nowe zadanie</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
        </div>

        <div class="modal-body">
          <label for="taskTitle" class="form-label">Tytuł</label>
          <input type="text" class="form-control" id="taskTitle">
          <div class="invalid-feedback">Tytuł musi mieć od 3 do 100 znaków.</div>
          <label for="taskPriority" class="form-label mt-3">Priorytet</label>
          <select class="form-select" id="taskPriority">
            <option value="high">Wysoki</option>
            <option value="medium" selected>Średni</option>
            <option value="low">Niski</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="submit" class="btn btn-primary">Zapisz</button>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
